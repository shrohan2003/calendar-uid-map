[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "calendar-uid-map"
version = "0.1.0"
description = "Compare event identities across local iCalendar exports"
requires-python = ">=3.10"
dependencies = ["icalendar>=6,<8"]

[project.scripts]
calendar-uid-map = "calendar_uid_map:main"

[tool.setuptools]
py-modules = ["calendar_uid_map"]
